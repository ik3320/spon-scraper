name: Auto Spon Sync

on:
  schedule:
    # 한국 시간 기준 매일 새벽 4시 (UTC 19:00)
    - cron: '0 19 * * *'
  # GitHub 상에서 버튼을 눌러 수동으로 실행 가능
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest

    steps:
    # 1. 저장소의 코드 가져오기
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. 가상 서버에 파이썬 설치
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. requirements.txt에 적힌 라이브러리 설치
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. 크롤러 스크립트 실행 (Secrets 변수 연결)
    - name: Run Sync Script
      env:
        GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
      run: |
        python scraper.py
