name: Auto Spon Sync

on:
  schedule:
    # 한국 시간 기준 매일 새벽 4시 (UTC 19:00)
    - cron: '0 19 * * *'
  # GitHub 상에서 수동으로 실행 가능하도록 설정
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest

    steps:
    # 1. 소스코드 체크아웃
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. 파이썬 환경 설정
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 필요한 패키지 설치
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests urllib3

    # 4. 파이썬 스크립트 실행 (Secrets 연결)
    - name: Run Sync Script
      env:
        GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
      run: |
        python scraper.py
